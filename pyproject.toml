[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raxtik-source-faers"
version = "0.1.0.dev1"
description = "Official FDA FAERS/AEMS data connector, parser, and extractor for raxtik-etl"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Raxtik Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "duckdb>=1.1.0",
    "raxtik-etl>=0.1.0.dev1",
    "requests>=2.31.0",
    "certifi>=2026.10.19",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "pyrefly>=1.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "tox>=4.0.0",
    "tox-uv>=1.11.0",
    "typos>=1.30.0",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/raxtik-org/raxtik-source-faers"
Documentation = "https://raxtik-source-faers.readthedocs.io"
Repository = "https://github.com/raxtik-org/raxtik-source-faers"
Issues = "https://github.com/raxtik-org/raxtik-source-faers/issues"

[project.entry-points."raxtik_etl.sources"]
faers = "raxtik_source_faers.adapter:FAERSAdapter"

[project.entry-points."raxtik_etl.clients"]
faers = "raxtik_source_faers:FAERS"

[tool.uv.sources]
raxtik-etl = { path = "../raxtik-etl", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/raxtik_source_faers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["raxtik_source_faers"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
