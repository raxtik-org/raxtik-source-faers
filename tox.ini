[tox]
requires =
    tox-uv>=1.11.0
env_list = py311, py312, py313, py314, py315, quality, docs
minversion = 4.0

[testenv]
deps =
    -r requirements-tests.txt
    # During active dev, test against raxtik-etl main directly from GitHub so CI validates
    # unreleased core engine changes (keeps pyproject.toml PyPI-compliant; revert to PyPI once stable).
    raxtik-etl @ git+https://github.com/raxtik-org/raxtik-etl.git@main
commands =
    pytest -v --cov=raxtik_source_faers --cov-report=xml --cov-report=term {posargs:tests}

[testenv:quality]
deps =
    -r requirements-lint.txt
    # Same as [testenv]: validate typing/lint against raxtik-etl main during active dev.
    raxtik-etl @ git+https://github.com/raxtik-org/raxtik-etl.git@main
commands =
    ruff check .
    ruff format --check .
    typos
    pyrefly check src/raxtik_source_faers

[testenv:lint]
deps =
    -r requirements-lint.txt
commands =
    ruff check .
    ruff format --check .
    typos

[testenv:type-pyrefly]
deps =
    -r requirements-lint.txt
    # Validate typing against raxtik-etl main during active dev.
    raxtik-etl @ git+https://github.com/raxtik-org/raxtik-etl.git@main
commands =
    pyrefly check src/raxtik_source_faers

[testenv:docs]
skip_install = true
deps =
    -r requirements-docs.txt
    # Build docs against raxtik-etl main during active dev.
    raxtik-etl @ git+https://github.com/raxtik-org/raxtik-etl.git@main
changedir = docs
commands =
    sphinx-build -aEWnb html . _build/html

