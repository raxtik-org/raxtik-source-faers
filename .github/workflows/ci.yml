name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 🧑‍🏭 Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout raxtik-source-faers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: raxtik-source-faers

      - name: Checkout raxtik-etl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raxtik-org/raxtik-etl
          path: raxtik-etl

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: raxtik-source-faers
        run: |
          uv venv --python 3.13
          uv pip install -e ../raxtik-etl
          uv pip install -e ".[dev]"

      - name: Lint with Ruff
        working-directory: raxtik-source-faers
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check spelling with Typos
        working-directory: raxtik-source-faers
        run: uv run typos

      - name: Type check with Pyrefly
        working-directory: raxtik-source-faers
        run: uv run pyrefly check src/raxtik_source_faers tests

      - name: Type check with Mypy
        working-directory: raxtik-source-faers
        run: uv run mypy src/raxtik_source_faers tests

  test:
    name: test (${{ matrix.os }} - py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"

    steps:
      - name: Checkout raxtik-source-faers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: raxtik-source-faers

      - name: Checkout raxtik-etl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raxtik-org/raxtik-etl
          path: raxtik-etl

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: raxtik-source-faers
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ../raxtik-etl
          uv pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        working-directory: raxtik-source-faers
        run: uv run pytest -v --cov=raxtik_source_faers --cov-report=xml --cov-report=term tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: raxtik-source-faers/coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
