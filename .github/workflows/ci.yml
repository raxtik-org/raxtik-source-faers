name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 🧑‍🏭 Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout raxtik-source-faers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: raxtik-source-faers

      - name: Checkout raxtik-etl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raxtik-org/raxtik-etl
          path: raxtik-etl

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Run lint and type checking with tox-uv
        working-directory: raxtik-source-faers
        run: uvx --with tox-uv tox run -e quality

  docs:
    name: 📖 Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout raxtik-source-faers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: raxtik-source-faers

      - name: Checkout raxtik-etl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raxtik-org/raxtik-etl
          path: raxtik-etl

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build documentation with tox-uv
        working-directory: raxtik-source-faers
        run: uvx --with tox-uv tox run -e docs

  packaging:
    name: 📦 Package Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout raxtik-source-faers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build sdist and wheels
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

  test:
    name: 🧪 test (${{ matrix.os }} - py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: quality
    if: "!startsWith(github.head_ref, 'all-contributors/')"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout raxtik-source-faers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: raxtik-source-faers

      - name: Checkout raxtik-etl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raxtik-org/raxtik-etl
          path: raxtik-etl

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run test suite with tox-uv
        working-directory: raxtik-source-faers
        run: uvx --with tox-uv tox run -e py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: raxtik-source-faers/coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
